<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of a TechCadd lab session">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554" />
      <stop offset="0.55" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#33366f" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />
  <rect width="1200" height="800" fill="url(#grid)" />
  <ellipse cx="600" cy="250" rx="520" ry="300" fill="url(#glow)" />

  <!-- front projection screen -->
  <rect x="330" y="90" width="540" height="300" rx="18" fill="#0f172a" fill-opacity="0.75" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2" />
  <rect x="330" y="90" width="540" height="44" rx="18" fill="#60a5fa" fill-opacity="0.12" />
  <circle cx="360" cy="112" r="6" fill="#f87171" fill-opacity="0.8" />
  <circle cx="382" cy="112" r="6" fill="#fbbf24" fill-opacity="0.8" />
  <circle cx="404" cy="112" r="6" fill="#34d399" fill-opacity="0.8" />
  <g fill="#93c5fd" fill-opacity="0.75">
    <rect x="366" y="168" width="150" height="12" rx="6" />
    <rect x="366" y="198" width="260" height="12" rx="6" />
    <rect x="396" y="228" width="200" height="12" rx="6" fill="#f0f9ff" fill-opacity="0.55" />
    <rect x="396" y="258" width="300" height="12" rx="6" />
    <rect x="366" y="288" width="180" height="12" rx="6" fill="#f0f9ff" fill-opacity="0.4" />
    <rect x="366" y="318" width="120" height="12" rx="6" />
  </g>
  <rect x="700" y="168" width="140" height="162" rx="12" fill="#2563eb" fill-opacity="0.35" />
  <path d="M716 300 L748 250 L780 274 L824 200" fill="none" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- desk row, back -->
  <g opacity="0.55">
    <rect x="170" y="470" width="240" height="14" rx="7" fill="#e2e8f0" fill-opacity="0.5" />
    <rect x="790" y="470" width="240" height="14" rx="7" fill="#e2e8f0" fill-opacity="0.5" />
    <rect x="228" y="404" width="124" height="76" rx="8" fill="url(#screen)" />
    <rect x="848" y="404" width="124" height="76" rx="8" fill="url(#screen)" />
    <circle cx="200" cy="430" r="30" fill="#0f172a" fill-opacity="0.65" />
    <path d="M160 480a44 44 0 0 1 80 0z" fill="#0f172a" fill-opacity="0.65" />
    <circle cx="1000" cy="430" r="30" fill="#0f172a" fill-opacity="0.65" />
    <path d="M960 480a44 44 0 0 1 80 0z" fill="#0f172a" fill-opacity="0.65" />
  </g>

  <!-- desk row, front -->
  <rect x="120" y="640" width="960" height="18" rx="9" fill="#e2e8f0" fill-opacity="0.85" />
  <rect x="150" y="658" width="18" height="110" rx="6" fill="#cbd5e1" fill-opacity="0.6" />
  <rect x="1032" y="658" width="18" height="110" rx="6" fill="#cbd5e1" fill-opacity="0.6" />

  <g>
    <rect x="210" y="490" width="180" height="104" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2" />
    <g fill="#60a5fa" fill-opacity="0.7">
      <rect x="230" y="514" width="80" height="9" rx="4.5" />
      <rect x="230" y="534" width="120" height="9" rx="4.5" />
      <rect x="230" y="554" width="60" height="9" rx="4.5" />
    </g>
    <rect x="510" y="490" width="180" height="104" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2" />
    <g fill="#93c5fd" fill-opacity="0.7">
      <rect x="530" y="514" width="120" height="9" rx="4.5" />
      <rect x="530" y="534" width="70" height="9" rx="4.5" />
      <rect x="530" y="554" width="100" height="9" rx="4.5" />
    </g>
    <rect x="810" y="490" width="180" height="104" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2" />
    <g fill="#60a5fa" fill-opacity="0.7">
      <rect x="830" y="514" width="95" height="9" rx="4.5" />
      <rect x="830" y="534" width="130" height="9" rx="4.5" />
      <rect x="830" y="554" width="55" height="9" rx="4.5" />
    </g>
  </g>

  <!--
    Seated learners, viewed from behind: heads overlap the lower half of each
    screen and the shoulders run under the desk edge at y=640.
  -->
  <g fill="#0b1220" fill-opacity="0.92">
    <circle cx="300" cy="612" r="32" />
    <path d="M248 660a52 52 0 0 1 104 0z" />
    <circle cx="600" cy="612" r="32" />
    <path d="M548 660a52 52 0 0 1 104 0z" />
    <circle cx="900" cy="612" r="32" />
    <path d="M848 660a52 52 0 0 1 104 0z" />
  </g>

  <!-- desk top redrawn over the shoulders so the row reads as one plane -->
  <rect x="120" y="640" width="960" height="18" rx="9" fill="#e2e8f0" fill-opacity="0.85" />
</svg>
