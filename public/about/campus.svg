<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of the TechCadd campus building">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="0.55" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.96" />
      <stop offset="1" stop-color="#cbd5e1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="mesh2" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#dusk)" />
  <rect width="1200" height="800" fill="url(#mesh2)" />
  <circle cx="960" cy="170" r="70" fill="#bfdbfe" fill-opacity="0.25" />
  <circle cx="960" cy="170" r="120" fill="#bfdbfe" fill-opacity="0.08" />

  <!-- neighbouring blocks -->
  <rect x="70" y="330" width="150" height="330" rx="10" fill="#0f172a" fill-opacity="0.55" />
  <rect x="1000" y="290" width="140" height="370" rx="10" fill="#0f172a" fill-opacity="0.55" />
  <g fill="#60a5fa" fill-opacity="0.35">
    <rect x="96" y="366" width="30" height="34" rx="5" />
    <rect x="140" y="366" width="30" height="34" rx="5" />
    <rect x="96" y="420" width="30" height="34" rx="5" />
    <rect x="140" y="420" width="30" height="34" rx="5" />
    <rect x="1026" y="330" width="30" height="34" rx="5" />
    <rect x="1070" y="330" width="30" height="34" rx="5" />
    <rect x="1026" y="384" width="30" height="34" rx="5" />
    <rect x="1070" y="384" width="30" height="34" rx="5" />
  </g>

  <!-- main building -->
  <rect x="250" y="200" width="700" height="460" rx="18" fill="url(#facade)" />
  <rect x="250" y="200" width="700" height="86" rx="18" fill="#1d4ed8" />
  <rect x="250" y="262" width="700" height="24" fill="#1d4ed8" />

  <!-- signage -->
  <g>
    <rect x="300" y="228" width="176" height="30" rx="8" fill="#ffffff" fill-opacity="0.92" />
    <rect x="316" y="238" width="144" height="10" rx="5" fill="#1d4ed8" fill-opacity="0.8" />
    <rect x="496" y="234" width="120" height="18" rx="6" fill="#93c5fd" fill-opacity="0.7" />
  </g>

  <!-- glazed bays -->
  <g>
    <rect x="290" y="320" width="180" height="120" rx="10" fill="url(#glass)" fill-opacity="0.85" />
    <rect x="510" y="320" width="180" height="120" rx="10" fill="url(#glass)" fill-opacity="0.7" />
    <rect x="730" y="320" width="180" height="120" rx="10" fill="url(#glass)" fill-opacity="0.85" />
    <rect x="290" y="470" width="180" height="120" rx="10" fill="url(#glass)" fill-opacity="0.7" />
    <rect x="730" y="470" width="180" height="120" rx="10" fill="url(#glass)" fill-opacity="0.8" />
  </g>
  <g stroke="#f8fafc" stroke-opacity="0.5" stroke-width="3">
    <path d="M380 320V440" />
    <path d="M600 320V440" />
    <path d="M820 320V440" />
    <path d="M380 470V590" />
    <path d="M820 470V590" />
  </g>

  <!-- entrance -->
  <rect x="510" y="470" width="180" height="190" rx="10" fill="#0f172a" fill-opacity="0.85" />
  <rect x="530" y="500" width="140" height="160" rx="8" fill="#60a5fa" fill-opacity="0.35" />
  <path d="M600 500V660" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="3" />
  <rect x="480" y="440" width="240" height="18" rx="9" fill="#1d4ed8" fill-opacity="0.9" />

  <!-- ground and figures -->
  <rect x="0" y="656" width="1200" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.55" />
  <g fill="#0b1220" fill-opacity="0.85">
    <circle cx="410" cy="606" r="18" />
    <path d="M382 656a28 28 0 0 1 56 0z" />
    <circle cx="466" cy="614" r="15" />
    <path d="M443 656a23 23 0 0 1 46 0z" />
    <circle cx="796" cy="610" r="17" />
    <path d="M769 656a27 27 0 0 1 54 0z" />
  </g>

  <!-- trees -->
  <g>
    <rect x="192" y="596" width="10" height="62" rx="4" fill="#0b1220" fill-opacity="0.7" />
    <circle cx="197" cy="580" r="38" fill="#34d399" fill-opacity="0.35" />
    <rect x="982" y="596" width="10" height="62" rx="4" fill="#0b1220" fill-opacity="0.7" />
    <circle cx="987" cy="584" r="32" fill="#34d399" fill-opacity="0.3" />
  </g>
</svg>
