<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Portrait placeholder for the founder">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset="0.55" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#33366f" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.5" />
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0" />
    </radialGradient>
    <pattern id="pmesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="900" height="1125" fill="url(#pbg)" />
  <rect width="900" height="1125" fill="url(#pmesh)" />
  <circle cx="450" cy="470" r="360" fill="url(#rim)" />

  <!-- backdrop arc -->
  <circle cx="450" cy="500" r="250" fill="#0f172a" fill-opacity="0.25" />
  <circle cx="450" cy="500" r="250" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="3" />

  <!-- silhouette: neck, shoulders, head, hairline, collar -->
  <g fill="#0b1220" fill-opacity="0.92">
    <rect x="398" y="640" width="104" height="180" rx="46" />
    <path d="M150 1125c0-200 134-320 300-320s300 120 300 320z" fill="url(#shirt)" />
    <circle cx="450" cy="560" r="140" />
    <path d="M310 552c0-86 63-148 140-148s140 62 140 148c-14-52-70-78-140-78s-126 26-140 78z" fill="#020617" fill-opacity="0.85" />
  </g>
  <path d="M382 826 L450 918 L518 826 L488 806 L450 856 L412 806 Z" fill="#e2e8f0" fill-opacity="0.9" />

  <!-- corner marks, so the plate reads as a framed portrait -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" fill="none">
    <path d="M70 140 V70 H140" />
    <path d="M760 70 H830 V140" />
    <path d="M830 985 V1055 H760" />
    <path d="M140 1055 H70 V985" />
  </g>
</svg>
