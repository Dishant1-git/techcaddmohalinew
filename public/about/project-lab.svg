<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of project work: an editor, a terminal and a results chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.6" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.94" />
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.78" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#93c5fd" />
    </linearGradient>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#mesh)" />
  <circle cx="230" cy="180" r="230" fill="#60a5fa" fill-opacity="0.16" />
  <circle cx="1010" cy="660" r="190" fill="#33366f" fill-opacity="0.5" />

  <!-- editor window -->
  <g>
    <rect x="90" y="120" width="640" height="420" rx="20" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.32" stroke-width="2" />
    <rect x="90" y="120" width="640" height="46" rx="20" fill="#60a5fa" fill-opacity="0.1" />
    <circle cx="122" cy="143" r="6" fill="#f87171" fill-opacity="0.85" />
    <circle cx="144" cy="143" r="6" fill="#fbbf24" fill-opacity="0.85" />
    <circle cx="166" cy="143" r="6" fill="#34d399" fill-opacity="0.85" />
    <rect x="90" y="166" width="120" height="374" fill="#ffffff" fill-opacity="0.03" />
    <g fill="#93c5fd" fill-opacity="0.28">
      <rect x="112" y="200" width="76" height="10" rx="5" />
      <rect x="112" y="230" width="60" height="10" rx="5" />
      <rect x="112" y="260" width="80" height="10" rx="5" />
      <rect x="112" y="290" width="54" height="10" rx="5" />
    </g>
    <g>
      <rect x="240" y="200" width="150" height="12" rx="6" fill="#c4b5fd" fill-opacity="0.8" />
      <rect x="404" y="200" width="220" height="12" rx="6" fill="#93c5fd" fill-opacity="0.6" />
      <rect x="268" y="234" width="120" height="12" rx="6" fill="#7dd3fc" fill-opacity="0.7" />
      <rect x="402" y="234" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.35" />
      <rect x="268" y="268" width="260" height="12" rx="6" fill="#93c5fd" fill-opacity="0.55" />
      <rect x="296" y="302" width="180" height="12" rx="6" fill="#fbbf24" fill-opacity="0.55" />
      <rect x="296" y="336" width="240" height="12" rx="6" fill="#93c5fd" fill-opacity="0.45" />
      <rect x="268" y="370" width="150" height="12" rx="6" fill="#7dd3fc" fill-opacity="0.6" />
      <rect x="240" y="404" width="200" height="12" rx="6" fill="#c4b5fd" fill-opacity="0.6" />
      <rect x="240" y="452" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.25" />
      <rect x="240" y="486" width="290" height="12" rx="6" fill="#93c5fd" fill-opacity="0.35" />
    </g>
  </g>

  <!-- terminal -->
  <g>
    <rect x="470" y="470" width="420" height="230" rx="18" fill="#020617" fill-opacity="0.92" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />
    <rect x="470" y="470" width="420" height="40" rx="18" fill="#34d399" fill-opacity="0.08" />
    <rect x="498" y="484" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.18" />
    <g fill="#34d399" fill-opacity="0.85">
      <rect x="498" y="540" width="14" height="12" rx="4" />
      <rect x="524" y="540" width="180" height="12" rx="6" fill-opacity="0.55" />
      <rect x="498" y="572" width="14" height="12" rx="4" />
      <rect x="524" y="572" width="260" height="12" rx="6" fill-opacity="0.4" />
      <rect x="498" y="604" width="14" height="12" rx="4" />
      <rect x="524" y="604" width="140" height="12" rx="6" fill-opacity="0.6" />
      <rect x="498" y="640" width="18" height="16" rx="4" />
    </g>
  </g>

  <!-- results panel -->
  <g>
    <rect x="800" y="180" width="330" height="300" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity="0.32" stroke-width="2" />
    <rect x="832" y="212" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.35" />
    <rect x="832" y="234" width="90" height="10" rx="5" fill="#60a5fa" fill-opacity="0.6" />
    <g>
      <rect x="836" y="360" width="42" height="80" rx="8" fill="url(#bar)" fill-opacity="0.75" />
      <rect x="894" y="322" width="42" height="118" rx="8" fill="url(#bar)" fill-opacity="0.8" />
      <rect x="952" y="384" width="42" height="56" rx="8" fill="url(#bar)" fill-opacity="0.6" />
      <rect x="1010" y="288" width="42" height="152" rx="8" fill="url(#bar)" />
      <rect x="1068" y="340" width="42" height="100" rx="8" fill="url(#bar)" fill-opacity="0.7" />
    </g>
    <path d="M846 350 L905 312 L963 372 L1021 278 L1079 330" fill="none" stroke="#f0f9ff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="1021" cy="278" r="8" fill="#f0f9ff" />
  </g>
</svg>
