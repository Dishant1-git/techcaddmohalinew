server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — safe to cache forever.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy /api and /uploads to the CMS API container.
    # This keeps the browser on the same origin (cms.domain) so session
    # cookies work with sameSite=lax — no need for sameSite=none + HTTPS.
    location /api/ {
        proxy_pass http://cms-api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass http://cms-api:4000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
